name: Build HYENGRA-LTW
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Android NDK
        uses: n0rt3n/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build with ndk-build
        run: |
          cd ltw/src/main/tinywrapper/
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_PLATFORM=android-24

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HYENGRA-LTW-Binaries
          path: ltw/src/main/tinywrapper/libs/
